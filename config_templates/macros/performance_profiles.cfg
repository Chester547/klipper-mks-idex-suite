# Perfiles de rendimiento del Modulo 2. Archivo ESTATICO: se autodetecta que
# steppers TMC2209/TMC2208 existen realmente en este printer.cfg via
# printer.configfile.settings, asi que el mismo archivo sirve tanto para
# maquinas de un solo cabezal como para IDEX sin regenerarse.
#
# TPWMTHRS alto (999999) favorece StealthChop casi siempre; TPWMTHRS=0
# favorece SpreadCycle casi siempre; un valor intermedio deja el cambio
# automatico por velocidad que ya hace el driver. ACCEL/VELOCITY se piden
# deliberadamente altos en Sport: SET_VELOCITY_LIMIT nunca puede superar los
# max_accel/max_velocity definidos en [printer], asi que en la practica
# "Sport" = usar el techo real configurado para esta maquina, sin arriesgar
# pasarse.

[gcode_macro _MKS_SET_TPWMTHRS]
description: Helper interno, no llamar directamente.
gcode:
    {% set value = params.VALUE|int %}
    {% for name in ['stepper_x', 'stepper_y', 'stepper_z', 'extruder', 'dual_carriage', 'extruder1'] %}
        {% if ('tmc2209 ' ~ name) in printer.configfile.settings or ('tmc2208 ' ~ name) in printer.configfile.settings %}
    SET_TMC_FIELD STEPPER={{ name }} FIELD=tpwmthrs VALUE={{ value }}
        {% endif %}
    {% endfor %}

[gcode_macro MKS_PERFORMANCE_QUIET]
description: StealthChop forzado, aceleraciones y velocidades conservadoras.
gcode:
    _MKS_SET_TPWMTHRS VALUE=999999
    SET_VELOCITY_LIMIT ACCEL=1200 VELOCITY=60 ACCEL_TO_DECEL=600
    { action_respond_info("Perfil de rendimiento: SILENCIOSO") }

[gcode_macro MKS_PERFORMANCE_BALANCED]
description: Cambio automatico StealthChop/SpreadCycle por velocidad, ajuste estandar.
gcode:
    _MKS_SET_TPWMTHRS VALUE=100
    SET_VELOCITY_LIMIT ACCEL=3000 VELOCITY=150 ACCEL_TO_DECEL=1500
    { action_respond_info("Perfil de rendimiento: BALANCEADO") }

[gcode_macro MKS_PERFORMANCE_SPORT]
description: SpreadCycle forzado, aceleraciones/velocidades al techo configurado en [printer].
gcode:
    _MKS_SET_TPWMTHRS VALUE=0
    SET_VELOCITY_LIMIT ACCEL=99999 VELOCITY=9999 ACCEL_TO_DECEL=99999
    { action_respond_info("Perfil de rendimiento: DEPORTIVO") }
