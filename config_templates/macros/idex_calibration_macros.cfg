# Macros del Modulo 2 (calibracion IDEX por camara). Archivo ESTATICO: no pasa
# por el renderizador Jinja2 de Python, usa unicamente el Jinja2 propio de
# Klipper en tiempo de ejecucion (printer.save_variables, printer.toolhead...).
#
# Requiere que kinematics/idex.cfg.j2 ya haya generado [dual_carriage],
# [extruder1] y [save_variables]. Solo se incluye cuando el perfil de
# hardware tiene kinematics=idex (ver mks_suite_common.render_templates).
#
# Extension sugerida (no incluida): parking del carro inactivo tipo
# PARK_extruder/PARK_extruder1, ver klipper/config/sample-idex.cfg.

[gcode_macro T0]
description: Activa el carro/extrusor primario (T0) y limpia cualquier offset residual.
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_OFFSET X=0 Y=0 MOVE=0

[gcode_macro T1]
description: Activa el carro/extrusor secundario (T1) y aplica el offset IDEX guardado.
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    {% set svv = printer.save_variables.variables %}
    {% if 'mks_idex_offset_x' in svv %}
    SET_GCODE_OFFSET X={{ svv.mks_idex_offset_x }} Y={{ svv.mks_idex_offset_y }} MOVE=0
    {% else %}
    { action_respond_info("T1: aun no hay offset IDEX calibrado, usando 0,0") }
    {% endif %}

[gcode_macro MKS_CAM_GOTO_REF]
description: Mueve el toolhead activo a la coordenada de referencia guardada de la camara de calibracion.
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if 'mks_cam_ref_x' not in svv %}
    { action_raise_error("MKS_CAM_GOTO_REF: no hay referencia de camara guardada -- inicia una sesion de calibracion desde la UI (/idex/start)") }
    {% endif %}
    {% set z_clear = svv.mks_cam_ref_z_clear | default(5) %}
    {% if printer.toolhead.position.z < z_clear %}
    G1 Z{{ z_clear }} F600
    {% endif %}
    G1 X{{ svv.mks_cam_ref_x }} Y{{ svv.mks_cam_ref_y }} F6000
    M400
