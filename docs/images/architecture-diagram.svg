<svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b62"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#39ff6a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="820" fill="#0e1210"/>

  <!-- GitHub -->
  <rect x="380" y="24" width="340" height="64" rx="10" fill="#161c19" stroke="#3a4a41" stroke-width="1.5"/>
  <text x="550" y="50" text-anchor="middle" fill="#e7efe9" font-size="16" font-weight="700">GitHub</text>
  <text x="550" y="72" text-anchor="middle" fill="#8ea395" font-size="12.5" font-family="SFMono-Regular,Consolas,monospace">github.com/&lt;tu-usuario&gt;/klipper-mks-idex-suite</text>

  <line x1="550" y1="88" x2="550" y2="128" stroke="#5c6b62" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="112" fill="#8ea395" font-size="12">git clone / git pull</text>

  <!-- install.sh -->
  <rect x="420" y="130" width="260" height="56" rx="10" fill="#1c2420" stroke="#39ff6a" stroke-width="1.5"/>
  <text x="550" y="164" text-anchor="middle" fill="#39ff6a" font-size="15" font-weight="700" font-family="SFMono-Regular,Consolas,monospace">install.sh</text>

  <line x1="550" y1="186" x2="550" y2="222" stroke="#5c6b62" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="208" fill="#8ea395" font-size="12">symlinks + moonraker.conf + macros</text>

  <!-- Host box -->
  <rect x="60" y="224" width="980" height="270" rx="14" fill="none" stroke="#2a352f" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="80" y="248" fill="#5c6b62" font-size="12.5">Raspberry Pi / host de la impresora</text>

  <!-- Moonraker box -->
  <rect x="90" y="264" width="420" height="200" rx="12" fill="#161c19" stroke="#3a4a41" stroke-width="1.5"/>
  <text x="110" y="290" fill="#e7efe9" font-size="15" font-weight="700">Moonraker</text>

  <rect x="110" y="304" width="180" height="46" rx="8" fill="#1c2420" stroke="#39ff6a" stroke-width="1.2"/>
  <text x="200" y="331" text-anchor="middle" fill="#39ff6a" font-size="12" font-family="SFMono-Regular,Consolas,monospace">mks_configurator.py</text>

  <rect x="300" y="304" width="190" height="46" rx="8" fill="#1c2420" stroke="#39ff6a" stroke-width="1.2"/>
  <text x="395" y="331" text-anchor="middle" fill="#39ff6a" font-size="12" font-family="SFMono-Regular,Consolas,monospace">idex_calibration.py</text>

  <rect x="110" y="362" width="190" height="38" rx="8" fill="#12160f" stroke="#2a352f"/>
  <text x="205" y="386" text-anchor="middle" fill="#8ea395" font-size="11.5">database (ns mks_idex_suite)</text>

  <rect x="310" y="362" width="180" height="38" rx="8" fill="#12160f" stroke="#2a352f"/>
  <text x="400" y="386" text-anchor="middle" fill="#8ea395" font-size="11.5">klippy_apis</text>

  <rect x="110" y="412" width="380" height="36" rx="8" fill="#12160f" stroke="#2a352f"/>
  <text x="300" y="435" text-anchor="middle" fill="#8ea395" font-size="11.5" font-family="SFMono-Regular,Consolas,monospace">/server/mks_suite/* (REST, sin frontend)</text>

  <!-- Klipper box -->
  <rect x="590" y="264" width="420" height="200" rx="12" fill="#161c19" stroke="#3a4a41" stroke-width="1.5"/>
  <text x="610" y="290" fill="#e7efe9" font-size="15" font-weight="700">Klipper (klippy)</text>

  <rect x="610" y="304" width="180" height="40" rx="8" fill="#12160f" stroke="#2a352f"/>
  <text x="700" y="328" text-anchor="middle" fill="#8ea395" font-size="11.5" font-family="SFMono-Regular,Consolas,monospace">printer.cfg</text>

  <rect x="800" y="304" width="180" height="40" rx="8" fill="#12160f" stroke="#2a352f"/>
  <text x="890" y="321" text-anchor="middle" fill="#8ea395" font-size="10.5" font-family="SFMono-Regular,Consolas,monospace">mks-suite-generated/</text>
  <text x="890" y="334" text-anchor="middle" fill="#8ea395" font-size="10.5" font-family="SFMono-Regular,Consolas,monospace">&lt;perfil&gt;/main.cfg</text>

  <rect x="610" y="354" width="180" height="40" rx="8" fill="#12160f" stroke="#2a352f"/>
  <text x="700" y="378" text-anchor="middle" fill="#8ea395" font-size="11" font-family="SFMono-Regular,Consolas,monospace">save_variables</text>

  <rect x="800" y="354" width="180" height="40" rx="8" fill="#12160f" stroke="#2a352f"/>
  <text x="890" y="378" text-anchor="middle" fill="#8ea395" font-size="11">dual_carriage / T0 / T1</text>

  <rect x="610" y="404" width="370" height="42" rx="8" fill="#12160f" stroke="#2a352f"/>
  <text x="795" y="429" text-anchor="middle" fill="#8ea395" font-size="11.5">TMC2209: SET_TMC_FIELD (perfiles de rendimiento)</text>

  <line x1="510" y1="360" x2="590" y2="360" stroke="#39ff6a" stroke-width="2" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccent)"/>
  <text x="520" y="352" fill="#39ff6a" font-size="11">gcode/script &#183; objects/query</text>

  <!-- Frontend row -->
  <rect x="60" y="522" width="450" height="90" rx="12" fill="#161c19" stroke="#3a4a41" stroke-width="1.5"/>
  <text x="80" y="546" fill="#e7efe9" font-size="14" font-weight="700">frontend/ (archivos, sin build step)</text>
  <rect x="80" y="558" width="140" height="38" rx="8" fill="#1c2420" stroke="#2a352f"/>
  <text x="150" y="582" text-anchor="middle" fill="#c9d6cf" font-size="11">index.html (2 botones)</text>
  <rect x="230" y="558" width="120" height="38" rx="8" fill="#1c2420" stroke="#2a352f"/>
  <text x="290" y="582" text-anchor="middle" fill="#c9d6cf" font-size="11">configurator/</text>
  <rect x="360" y="558" width="140" height="38" rx="8" fill="#1c2420" stroke="#2a352f"/>
  <text x="430" y="582" text-anchor="middle" fill="#c9d6cf" font-size="11">idex_calibration/</text>

  <!-- Camera / Crowsnest -->
  <rect x="560" y="522" width="230" height="90" rx="12" fill="#161c19" stroke="#3a4a41" stroke-width="1.5"/>
  <text x="580" y="546" fill="#e7efe9" font-size="13.5" font-weight="700">C&#225;mara USB/CSI</text>
  <text x="580" y="566" fill="#8ea395" font-size="11.5">V4L2 / libcamera</text>
  <line x1="675" y1="576" x2="675" y2="600" stroke="#5c6b62" stroke-width="1.5"/>
  <text x="580" y="602" fill="#8ea395" font-size="11.5">&#8595; Crowsnest (MJPEG)</text>

  <line x1="560" y1="565" x2="490" y2="577" stroke="#5c6b62" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- nginx -->
  <line x1="285" y1="612" x2="285" y2="644" stroke="#39ff6a" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="298" y="632" fill="#39ff6a" font-size="10.5">root</text>

  <line x1="850" y1="494" x2="850" y2="644" stroke="#39ff6a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="858" y="570" fill="#39ff6a" font-size="10.5">proxy_pass</text>

  <rect x="120" y="646" width="700" height="60" rx="12" fill="#1c2420" stroke="#39ff6a" stroke-width="1.5"/>
  <text x="140" y="668" fill="#39ff6a" font-size="14" font-weight="700">nginx :7140 (vhost dedicado, agregado por install.sh)</text>
  <text x="140" y="688" fill="#8ea395" font-size="11" font-family="SFMono-Regular,Consolas,monospace">root frontend/ &#183; proxy_pass /server /printer /api /access /machine /websocket -&gt; 127.0.0.1:7125</text>

  <line x1="470" y1="706" x2="470" y2="726" stroke="#39ff6a" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <!-- Browser -->
  <rect x="120" y="728" width="700" height="70" rx="12" fill="#0f1512" stroke="#39ff6a" stroke-width="1.5"/>
  <text x="470" y="756" text-anchor="middle" fill="#39ff6a" font-size="15" font-weight="700">Navegador</text>
  <text x="470" y="778" text-anchor="middle" fill="#8ea395" font-size="12">http://&lt;ip&gt;:7140/ -- mismo origen para la API, sin CORS</text>

  <!-- update_manager loop -->
  <path d="M 720 158 C 900 158, 960 60, 720 56" fill="none" stroke="#8ea395" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="760" y="110" fill="#8ea395" font-size="11.5">[update_manager mks_idex_suite]&#10;detecta commits nuevos</text>
  <text x="760" y="126" fill="#8ea395" font-size="11.5">-&gt; pull + install_script + restart moonraker</text>
</svg>
