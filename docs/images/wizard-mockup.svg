<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#0e1210"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="600" fill="#161c19"/>
  <line x1="220" y1="0" x2="220" y2="600" stroke="#2a352f"/>
  <circle cx="26" cy="30" r="4.5" fill="#39ff6a"/>
  <text x="38" y="35" fill="#39ff6a" font-size="15" font-weight="700">mks-idex-suite</text>

  <g font-size="13" font-family="-apple-system,Segoe UI,sans-serif">
    <g fill="#7c9084">
      <circle cx="30" cy="76" r="9" fill="#39ff6a"/>
      <text x="26" y="80" fill="#05170a" font-size="10" text-anchor="middle">&#10003;</text>
      <text x="48" y="80" fill="#c9d6cf">Placa base</text>

      <circle cx="30" cy="108" r="9" fill="#39ff6a"/>
      <text x="26" y="112" fill="#05170a" font-size="10" text-anchor="middle">&#10003;</text>
      <text x="48" y="112" fill="#c9d6cf">Cinematica</text>
    </g>

    <circle cx="30" cy="140" r="9" fill="none" stroke="#39ff6a" stroke-width="1.5"/>
    <text x="30" y="144" fill="#39ff6a" font-size="10" text-anchor="middle">3</text>
    <text x="48" y="144" fill="#39ff6a" font-weight="700">Drivers</text>

    <g fill="#5c6b62">
      <circle cx="30" cy="172" r="9" fill="none" stroke="#2a352f"/>
      <text x="30" y="176" font-size="10" text-anchor="middle">4</text>
      <text x="48" y="176">Hotends / Extrusores</text>

      <circle cx="30" cy="204" r="9" fill="none" stroke="#2a352f"/>
      <text x="30" y="208" font-size="10" text-anchor="middle">5</text>
      <text x="48" y="208">Perifericos</text>

      <circle cx="30" cy="236" r="9" fill="none" stroke="#2a352f"/>
      <text x="30" y="240" font-size="10" text-anchor="middle">6</text>
      <text x="48" y="240">MCUs secundarias</text>

      <circle cx="30" cy="268" r="9" fill="none" stroke="#2a352f"/>
      <text x="30" y="272" font-size="10" text-anchor="middle">7</text>
      <text x="48" y="272">Confirmar y aplicar</text>
    </g>
  </g>

  <rect x="18" y="310" width="184" height="80" rx="8" fill="#1c2420" stroke="#2a352f"/>
  <text x="30" y="330" fill="#c9d6cf" font-size="11.5" font-weight="700">Perfiles guardados</text>
  <rect x="30" y="340" width="160" height="22" rx="5" fill="#101512" stroke="#2a352f"/>
  <text x="38" y="355" fill="#7c9084" font-size="10.5">monster8-idex-taller</text>
  <rect x="30" y="368" width="160" height="16" rx="4" fill="none"/>
  <text x="38" y="380" fill="#39ff6a" font-size="10.5">+ Nuevo perfil</text>

  <!-- topbar -->
  <text x="248" y="46" fill="#e7efe9" font-size="21" font-weight="700">Configurador MKS/Creality</text>
  <text x="248" y="66" fill="#7c9084" font-size="12.5">Paso 3 de 7 -- Drivers</text>
  <rect x="860" y="28" width="112" height="26" rx="13" fill="#39ff6a" fill-opacity="0.12"/>
  <text x="916" y="45" fill="#39ff6a" font-size="11.5" text-anchor="middle" font-weight="700">Guardado</text>

  <!-- driver card stepper_x -->
  <rect x="248" y="92" width="700" height="180" rx="10" fill="#1c2420" stroke="#2a352f"/>
  <text x="268" y="118" fill="#e7efe9" font-size="14.5" font-weight="700">stepper_x</text>

  <g font-size="10.5" fill="#7c9084">
    <text x="268" y="140">Driver</text>
    <text x="268" y="182">UART pin</text>
    <text x="268" y="226">Corriente (A)</text>
    <text x="450" y="140">Interfaz</text>
    <text x="450" y="182">DIAG pin</text>
    <text x="632" y="140">Sensorless homing</text>
  </g>
  <g fill="#101512" stroke="#2a352f">
    <rect x="268" y="146" width="160" height="26" rx="6"/>
    <rect x="450" y="146" width="160" height="26" rx="6"/>
    <rect x="268" y="188" width="160" height="26" rx="6"/>
    <rect x="450" y="188" width="160" height="26" rx="6"/>
    <rect x="268" y="232" width="160" height="26" rx="6"/>
  </g>
  <text x="280" y="164" fill="#c9d6cf" font-size="11" font-family="SFMono-Regular,Consolas,monospace">TMC2209</text>
  <text x="462" y="164" fill="#c9d6cf" font-size="11" font-family="SFMono-Regular,Consolas,monospace">UART</text>
  <text x="280" y="206" fill="#c9d6cf" font-size="11" font-family="SFMono-Regular,Consolas,monospace">PD5</text>
  <text x="462" y="206" fill="#c9d6cf" font-size="11" font-family="SFMono-Regular,Consolas,monospace">^PA15</text>
  <text x="280" y="250" fill="#c9d6cf" font-size="11" font-family="SFMono-Regular,Consolas,monospace">0.80</text>
  <rect x="632" y="148" width="34" height="18" rx="4" fill="#39ff6a"/>
  <circle cx="658" cy="157" r="7" fill="#05170a"/>
  <text x="676" y="162" fill="#c9d6cf" font-size="11">activado</text>

  <!-- driver card stepper_y (partial) -->
  <rect x="248" y="286" width="700" height="60" rx="10" fill="#1c2420" stroke="#2a352f"/>
  <text x="268" y="312" fill="#e7efe9" font-size="14.5" font-weight="700">stepper_y</text>
  <text x="268" y="332" fill="#5c6b62" font-size="11">TMC2209 &#183; UART &#183; PD7 &#183; 0.80A</text>

  <!-- footer -->
  <rect x="248" y="546" width="110" height="34" rx="8" fill="none" stroke="#2a352f"/>
  <text x="303" y="567" fill="#c9d6cf" font-size="12" text-anchor="middle">Atras</text>
  <rect x="700" y="546" width="130" height="34" rx="8" fill="none" stroke="#2a352f"/>
  <text x="765" y="567" fill="#c9d6cf" font-size="12" text-anchor="middle">Guardar perfil</text>
  <rect x="840" y="546" width="108" height="34" rx="8" fill="#39ff6a"/>
  <text x="894" y="567" fill="#05170a" font-size="12" font-weight="700" text-anchor="middle">Siguiente</text>
</svg>
