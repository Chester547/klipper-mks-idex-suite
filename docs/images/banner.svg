<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mks-idex-suite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1210"/>
      <stop offset="100%" stop-color="#141d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff6a"/>
      <stop offset="100%" stop-color="#9bffb8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="260" fill="url(#bg)"/>
  <circle cx="1000" cy="130" r="260" fill="url(#glow)"/>

  <!-- grid backdrop -->
  <g stroke="#1f2a24" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 220 H1200"/>
    <path d="M150 0 V260 M400 0 V260 M650 0 V260 M900 0 V260 M1050 0 V260"/>
  </g>

  <!-- crosshair / reticle mark -->
  <g transform="translate(120,130)">
    <circle r="62" fill="none" stroke="#39ff6a" stroke-width="3" opacity="0.9"/>
    <circle r="62" fill="none" stroke="#39ff6a" stroke-width="12" opacity="0.12"/>
    <line x1="-84" y1="0" x2="84" y2="0" stroke="#39ff6a" stroke-width="2.5"/>
    <line x1="0" y1="-84" x2="0" y2="84" stroke="#39ff6a" stroke-width="2.5"/>
    <circle r="6" fill="#39ff6a"/>
    <circle r="62" fill="none" stroke="#39ff6a" stroke-width="2" stroke-dasharray="4 10" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="230" y="112" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="54" font-weight="800" fill="#e7efe9">mks-idex-suite</text>
  <text x="232" y="150" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#8ea395">Configurador MKS/Creality &#183; Calibraci&#243;n IDEX por c&#225;mara &#183; Instalable desde GitHub</text>

  <g font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#39ff6a">
    <rect x="232" y="172" width="132" height="28" rx="6" fill="#39ff6a" fill-opacity="0.1" stroke="#1f8a44"/>
    <text x="248" y="191">Klipper</text>
    <rect x="376" y="172" width="150" height="28" rx="6" fill="#39ff6a" fill-opacity="0.1" stroke="#1f8a44"/>
    <text x="392" y="191">Moonraker</text>
    <rect x="538" y="172" width="140" height="28" rx="6" fill="#39ff6a" fill-opacity="0.1" stroke="#1f8a44"/>
    <text x="554" y="191">Mainsail</text>
    <rect x="690" y="172" width="150" height="28" rx="6" fill="#39ff6a" fill-opacity="0.1" stroke="#1f8a44"/>
    <text x="706" y="191">update_manager</text>
  </g>
</svg>
