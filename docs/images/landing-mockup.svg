  <text x="552" y="390" fill="#39ff6a" font-size="13" font-weight="700">Abrir calibracion &#8594;</text>

  <text x="500" y="500" text-anchor="middle" fill="#5c6b62" font-size="12">mks-idex-suite &#183; GitHub</text>
