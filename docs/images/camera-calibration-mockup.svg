  <g transform="translate(891,205)">
    <circle r="68" fill="#12160f" stroke="#2a352f" stroke-width="1.5"/>
    <path d="M 0 -58 L 25 -22 L -25 -22 Z" fill="#20281f" stroke="#2a352f"/>
    <text y="-34" text-anchor="middle" fill="#8ea395" font-size="10">Y+</text>
    <path d="M 0 58 L 25 22 L -25 22 Z" fill="#20281f" stroke="#2a352f"/>
    <text y="46" text-anchor="middle" fill="#8ea395" font-size="10">Y-</text>
    <path d="M -58 0 L -22 -25 L -22 25 Z" fill="#20281f" stroke="#2a352f"/>
    <text x="-38" y="4" text-anchor="middle" fill="#8ea395" font-size="10">X-</text>
    <path d="M 58 0 L 22 -25 L 22 25 Z" fill="#20281f" stroke="#2a352f"/>
