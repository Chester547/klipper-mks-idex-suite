  <rect x="800" y="322" width="182" height="180" rx="12" fill="#1c2420" stroke="#2a352f"/>
  <text x="816" y="346" fill="#e7efe9" font-size="13" font-weight="700">Actividad</text>
  <g font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#7c9084">
    <text x="816" y="364">[10:41:02] Offset T1: X=-0.18</text>
    <text x="816" y="378">Y=0.26</text>
    <text x="816" y="396">[10:40:51] Herramienta activa:</text>
    <text x="816" y="408">T1</text>
    <text x="816" y="426">[10:40:22] Sesion iniciada:</text>
    <text x="816" y="438">G28 + T0 en referencia.</text>
