  <rect x="222" y="124" width="560" height="336" fill="#04100a"/>
  <circle cx="502" cy="292" r="230" fill="#0a2018" opacity="0.6"/>
  <circle cx="502" cy="292" r="150" fill="#0d2b1e" opacity="0.7"/>
  <circle cx="502" cy="292" r="70" fill="#123a28"/>
  <circle cx="502" cy="292" r="38" fill="#020a06"/>

