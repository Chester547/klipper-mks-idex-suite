  <text x="816" y="106" fill="#e7efe9" font-size="13" font-weight="700">Ajuste fino</text>

  <g font-size="9.5">
    <rect x="816" y="116" width="34" height="20" fill="#101512" stroke="#2a352f"/>
    <text x="833" y="130" fill="#8ea395" text-anchor="middle">0.05</text>
