  <text x="667" y="109" fill="#05170a" font-size="10" text-anchor="middle" font-weight="700">1X</text>
  <rect x="688" y="94" width="42" height="22" fill="#101512" stroke="#2a352f"/>
  <text x="709" y="109" fill="#8ea395" font-size="10" text-anchor="middle">2X</text>
  <rect x="730" y="94" width="42" height="22" fill="#101512" stroke="#2a352f"/>
  <text x="751" y="109" fill="#8ea395" font-size="10" text-anchor="middle">4X</text>

