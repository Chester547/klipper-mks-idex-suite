    <text x="895" y="130" fill="#8ea395" text-anchor="middle">0.5</text>
    <rect x="910" y="116" width="26" height="20" fill="#101512" stroke="#2a352f"/>
    <text x="923" y="130" fill="#8ea395" text-anchor="middle">1</text>
